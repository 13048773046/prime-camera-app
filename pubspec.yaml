name: prime_camera
description: "定焦 PRIME · AI 构图相机 MVP"
publish_to: 'none'
version: 0.7.2+20

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.3.1
  http: ^1.2.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo/
    - assets/ai/
    - assets/doka/
  fonts:
    - family: PrimeSans
      fonts:
        - asset: assets/fonts/PrimeSans.otf
