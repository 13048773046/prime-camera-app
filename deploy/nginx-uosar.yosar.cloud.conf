# /etc/nginx/sites-available/uosar.yosar.cloud
# 先 certbot 签发证书，再启用 443；80 只做跳转。
server {
    listen 80;
    listen [::]:80;
    server_name uosar.yosar.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uosar.yosar.cloud;

    ssl_certificate /etc/letsencrypt/live/uosar.yosar.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uosar.yosar.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 拍一帧上传，给 8MB 图片留余量
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    access_log /var/log/nginx/uosar.access.log;
    error_log  /var/log/nginx/uosar.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # H5 与落地页不缓存 HTML，避免发版后拿到旧页
    location ~* ^/(h5|admin)/?$ {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }
}
